[project]
name = "ty-chat"
version = "0.1.0"
description = "Travel Yantra chat engine: POST /chat for the web chat panel and the WhatsApp bot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "google-genai>=1.0",
    "ty-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ty_chat"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "uvicorn>=0.30"]

[tool.uv.sources]
# Editable, as in apps/api, so both resolve the contracts the same way when ty-api installs this.
ty-contracts = { path = "../../../packages/contracts", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["ty_chat"]
