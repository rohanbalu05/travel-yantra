[project]
name = "travel-yantra-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "google-adk>=1.0",
    "google-auth>=2.40",
    "numpy>=1.26",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "ty-contracts",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# local multilingual-e5-small embeddings; tests set EMBEDDER=fake and skip this
embeddings = ["sentence-transformers>=3", "torch>=2.4"]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
# apps/api on the path so `core`, `guide` and `routes` import as top-level packages.
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false

[tool.uv.sources]
ty-contracts = { path = "../../packages/contracts", editable = true }
# CPU-only torch on Linux (the API image and CI): no CUDA wheels. Other platforms keep PyPI's build.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff.lint]
# Pin the rule set so a new ruff release cannot turn every lane red.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "E731"]

[tool.ruff.lint.isort]
# Fixed list so import order does not drift with what is on each machine's path.
known-first-party = ["core", "guide", "routes", "ty_contracts"]
