[project]
name = "travel-yantra-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "google-adk>=1.0",
    "pydantic>=2.7",
    "ty-contracts",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
# apps/api on the path so `core`, `guide` and `routes` import as top-level packages.
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false

[tool.uv.sources]
ty-contracts = { path = "../../packages/contracts", editable = true }

[tool.ruff.lint]
# Pin the rule set: newer ruff defaults add I, UP and RUF, which fail every lane.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "E731"]
