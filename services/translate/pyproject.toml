[project]
name = "ty-translate"
version = "0.1.0"
description = "Travel Yantra translation service (IndicTrans2)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Real model stack. Installed in the Docker image and in the slow CI job only.
model = [
    "torch>=2.3",
    "transformers>=4.44,<5",
    "sentencepiece",
    "sacremoses",
    "IndicTransToolkit",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads the real IndicTrans2 model (CI only)"]
addopts = "-m 'not slow'"
pythonpath = ["."]

[tool.ruff]
line-length = 100
