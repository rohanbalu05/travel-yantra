name: guard

# Rejects attribution text, unknown commit authors and leaked secrets.
# pull_request_target + base-branch checkout: the check logic always comes
# from main, so a PR cannot edit its own guard. PR code is never executed.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the PR head
        run: git fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/head:pr-head"
      - name: Attribution and authors
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/guard.py "${{ github.event.pull_request.base.sha }}" pr-head
      - name: Secret scan (PR range)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL --max-time 60 "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --redact --no-banner --log-opts "${{ github.event.pull_request.base.sha }}..pr-head"
