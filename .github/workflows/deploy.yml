name: deploy

# Deploys changed services to Cloud Run (asia-south1) through Workload
# Identity Federation. Defers cleanly while no Google Cloud project exists.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          HAVE_GCP: ${{ vars.GCP_PROJECT_ID != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOY_SA != '' }}
        run: |
          if [ "$HAVE_GCP" != "true" ]; then
            echo "deploy deferred: no Google Cloud project yet"
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"; exit 0
          fi
          base=${{ github.event.before }}; git cat-file -e "$base" 2>/dev/null || base=HEAD~1
          changed=$(git diff --name-only "$base" HEAD)
          out=()
          for pair in ty-api:apps/api ty-translate:services/translate ty-bots:apps/bots ty-mcp:apps/mcp; do
            name=${pair%%:*}; dir=${pair#*:}
            [ -f "$dir/Dockerfile" ] || { echo "skip $name: no Dockerfile in $dir"; continue; }
            echo "$changed" | grep -q "^$dir/" || echo "$changed" | grep -q "^packages/contracts/" || { echo "skip $name: unchanged"; continue; }
            out+=("{\"name\":\"$name\",\"dir\":\"$dir\"}")
          done
          echo "matrix=[$(IFS=,; echo "${out[*]}")]" >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build ${{ matrix.service.name }}
        env:
          IMAGE: asia-south1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ty/${{ matrix.service.name }}:${{ github.sha }}
        run: |
          gcloud builds submit . --config infra/cloudbuild/image.yaml \
            --substitutions "_DOCKERFILE=${{ matrix.service.dir }}/Dockerfile,_IMAGE=$IMAGE" \
            --project "${{ vars.GCP_PROJECT_ID }}"
      - name: Deploy ${{ matrix.service.name }}
        run: |
          gcloud run deploy "${{ matrix.service.name }}" \
            --image "asia-south1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ty/${{ matrix.service.name }}:${{ github.sha }}" \
            --region asia-south1 --project "${{ vars.GCP_PROJECT_ID }}" --quiet
