name: deploy

# Deploys changed services to Cloud Run (asia-south1) through Workload
# Identity Federation, only for a commit whose ci run on main passed (P4).

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Each run finishes and GitHub keeps only the newest waiting one. A skipped
# commit's services still ship: the plan compares each service with the commit
# it runs now (GIT_SHA on Cloud Run), and never replaces a newer one.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  # The ci-green commit (workflow_run), or main's head on a manual run.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - name: ci passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # workflow_run already means green; a manual run checks for itself.
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci --commit "$SHA" --status success \
            --limit 1 --json databaseId --jq length)
          [ "$n" = "1" ] || { echo "::error::no green ci run for $SHA; not deploying"; exit 1; }
          echo "ci green for $SHA"
      - id: gcp
        env:
          HAVE_GCP: ${{ vars.GCP_PROJECT_ID != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOY_SA != '' }}
        run: echo "ok=$HAVE_GCP" >> "$GITHUB_OUTPUT"
      - if: steps.gcp.outputs.ok == 'true'
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - if: steps.gcp.outputs.ok == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - id: plan
        env:
          HAVE_GCP: ${{ steps.gcp.outputs.ok }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          if [ "$HAVE_GCP" != "true" ]; then
            echo "deploy deferred: no Google Cloud project yet"
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The commit each service runs now; empty if the service doesn't exist.
          live='{}'
          for name in ty-api ty-web ty-translate ty-bots ty-mcp; do
            s=$(gcloud run services describe "$name" --region asia-south1 --project "$PROJECT" \
              --format json 2>/dev/null \
              | jq -r '[.spec.template.spec.containers[0].env[]? | select(.name == "GIT_SHA") | .value][0] // ""' \
              || true)
            echo "$name live at ${s:-unknown}"
            live=$(jq -cn --argjson m "$live" --arg n "$name" --arg s "$s" '$m + {($n): $s}')
          done
          all=""
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && all=--all
          matrix=$(python3 .github/scripts/deploy_plan.py "$SHA" "$live" $all)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    # Build (up to 30 min for ty-api's torch image) + deploy + warm-up.
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      # Cloud Build allows few build-status reads per minute per project.
      max-parallel: 3
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build ${{ matrix.service.name }}
        env:
          IMAGE: asia-south1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ty/${{ matrix.service.name }}:${{ env.SHA }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
          FB_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          FB_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          FB_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          FB_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: |
          # The web build inlines the live API URL (empty until ty-api exists) and
          # the Firebase web config (V3-AG) from repo variables. It's public client
          # config, but the commit hooks block its key pattern, so it lives in
          # GitHub variables, not the repo. Empty means sign-in stays off.
          api_url="" fb=""
          if [ "${{ matrix.service.name }}" = "ty-web" ]; then
            api_url=$(gcloud run services describe ty-api --region asia-south1 --project "$PROJECT" \
              --format 'value(status.url)' 2>/dev/null || true)
            fb="_FB_API_KEY=$FB_API_KEY~_FB_AUTH_DOMAIN=$FB_AUTH_DOMAIN~_FB_PROJECT_ID=$FB_PROJECT_ID~_FB_APP_ID=$FB_APP_ID"
            if [ -n "$FB_API_KEY" ] && [ -n "$FB_AUTH_DOMAIN" ] && [ -n "$FB_PROJECT_ID" ]; then
              echo "firebase web config: set"
            else
              echo "firebase web config: incomplete or not set (sign-in off)"
            fi
          fi
          # An explicit staging dir skips gcloud's default-bucket ownership check,
          # which needs project-wide storage.buckets.list that ty-deploy lacks.
          # --async, then poll every 15 s: gcloud's own wait polls each second and
          # parallel jobs hit Cloud Build's per-minute read quota (429).
          id=$(gcloud builds submit . --config infra/cloudbuild/image.yaml --async --format 'value(id)' \
            --region asia-south1 --service-account "projects/$PROJECT/serviceAccounts/$DEPLOY_SA" \
            --gcs-source-staging-dir "gs://${PROJECT}_cloudbuild/source" \
            --substitutions "^~^_DOCKERFILE=${{ matrix.service.dockerfile }}~_IMAGE=$IMAGE~_API_BASE_URL=$api_url${fb:+~$fb}" \
            --project "$PROJECT")
          echo "build $id"
          # Give up after 10 failed reads in a row, or 33 min (the build's own
          # limit is 30), and cancel the build so it doesn't run on unwatched.
          fails=0 deadline=$((SECONDS + 1980))
          while :; do
            status=$(gcloud builds describe "$id" --region asia-south1 --project "$PROJECT" --format 'value(status)' || echo RETRY)
            case "$status" in
              SUCCESS) echo "build $id: SUCCESS"; break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) echo "::error::build $id: $status"; exit 1 ;;
              RETRY) fails=$((fails + 1)) ;;
              *) fails=0 ;;
            esac
            if [ "$fails" -ge 10 ] || [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::build $id: no result (status $status, $fails failed reads)"
              gcloud builds cancel "$id" --region asia-south1 --project "$PROJECT" || true
              exit 1
            fi
            sleep 15
          done
      - name: Deploy ${{ matrix.service.name }}
        # Only the image and GIT_SHA change here. Runtime service account,
        # secrets and env are set once by infra/gcp/run-services.sh and kept.
        run: |
          gcloud run deploy "${{ matrix.service.name }}" \
            --image "asia-south1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ty/${{ matrix.service.name }}:${{ env.SHA }}" \
            --update-env-vars "GIT_SHA=${{ env.SHA }}" \
            --region asia-south1 --project "${{ vars.GCP_PROJECT_ID }}" --quiet
      - name: Warm ty-api's guide model
        # V3-AC: request-based CPU starves the background warm-up, so one real
        # /guide/ask loads e5 while a request holds the CPU (1–2 Gemini calls).
        # The every-minute uptime check then keeps that instance alive.
        # A failed warm-up never fails the deploy.
        if: matrix.service.name == 'ty-api'
        run: |
          url=$(gcloud run services describe ty-api --region asia-south1 \
            --project "${{ vars.GCP_PROJECT_ID }}" --format 'value(status.url)' || true)
          curl -sS -o /dev/null --max-time 120 -X POST "$url/guide/ask" \
            -H 'content-type: application/json' \
            -d '{"question":"When was Mysore Palace built?","city":"Mysuru"}' \
            -w "warm-up /guide/ask: HTTP %{http_code} in %{time_total}s\n" || echo "warm-up request failed (ignored)"
