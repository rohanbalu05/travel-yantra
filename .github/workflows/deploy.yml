name: deploy

# Deploys changed services to Cloud Run (asia-south1) through Workload
# Identity Federation. Defers cleanly while no Google Cloud project exists.

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - apps/web/**
      - apps/mcp/**
      - apps/bots/**
      - services/translate/**
      - packages/contracts/**
      - infra/web/**
      - infra/cloudbuild/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an older deploy; Cloud Run swaps revisions
# atomically, so a cancelled run leaves the previous revision serving, and the
# plan diffs from the last green deploy so nothing the cancelled run held is lost.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          HAVE_GCP: ${{ vars.GCP_PROJECT_ID != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOY_SA != '' }}
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$HAVE_GCP" != "true" ]; then
            echo "deploy deferred: no Google Cloud project yet"
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Diff from the last green deploy, not just this push's parent: a run
          # cancelled by a newer push must not drop the services it would have shipped.
          base=$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy --branch main --status success \
            --limit 1 --json headSha --jq '.[0].headSha // empty' 2>/dev/null || true)
          git cat-file -e "$base" 2>/dev/null || base=$BEFORE
          git cat-file -e "$base" 2>/dev/null || base=HEAD~1
          echo "diff base: $base"
          changed=$(git diff --name-only "$base" HEAD)
          # A manual run or a change to the deploy plumbing redeploys everything.
          all=false
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && all=true
          echo "$changed" | grep -qE '^(\.github/workflows/deploy\.yml|infra/cloudbuild/)' && all=true
          out=()
          # name:source dir:Dockerfile. ty-translate (services/translate) is left out
          # until HQ picks IndicTrans2 (gated weights) or the Gemini fallback.
          for entry in ty-api:apps/api:apps/api/Dockerfile ty-web:apps/web:infra/web/Dockerfile \
                       ty-bots:apps/bots/whatsapp:apps/bots/whatsapp/Dockerfile ty-mcp:apps/mcp:apps/mcp/Dockerfile; do
            IFS=: read -r name dir dockerfile <<< "$entry"
            [ -f "$dockerfile" ] || { echo "skip $name: no $dockerfile"; continue; }
            [ -f "$dir/package.json" ] || [ -f "$dir/pyproject.toml" ] || { echo "skip $name: no project in $dir"; continue; }
            if [ "$all" != "true" ] && ! echo "$changed" | grep -qE "^($dir/|packages/contracts/|$(dirname "$dockerfile")/)"; then
              echo "skip $name: unchanged"; continue
            fi
            out+=("{\"name\":\"$name\",\"dir\":\"$dir\",\"dockerfile\":\"$dockerfile\"}")
          done
          echo "matrix=[$(IFS=,; echo "${out[*]}")]" >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build ${{ matrix.service.name }}
        env:
          IMAGE: asia-south1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ty/${{ matrix.service.name }}:${{ github.sha }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
        run: |
          # The web build inlines the live API URL (empty until ty-api exists).
          api_url=""
          if [ "${{ matrix.service.name }}" = "ty-web" ]; then
            api_url=$(gcloud run services describe ty-api --region asia-south1 --project "$PROJECT" \
              --format 'value(status.url)' 2>/dev/null || true)
          fi
          gcloud builds submit . --config infra/cloudbuild/image.yaml \
            --region asia-south1 --service-account "projects/$PROJECT/serviceAccounts/$DEPLOY_SA" \
            --substitutions "_DOCKERFILE=${{ matrix.service.dockerfile }},_IMAGE=$IMAGE,_API_BASE_URL=$api_url" \
            --project "$PROJECT"
      - name: Deploy ${{ matrix.service.name }}
        # Only the image and GIT_SHA change here. Runtime service account,
        # secrets and env are set once by infra/gcp/run-services.sh and kept.
        run: |
          gcloud run deploy "${{ matrix.service.name }}" \
            --image "asia-south1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ty/${{ matrix.service.name }}:${{ github.sha }}" \
            --update-env-vars "GIT_SHA=${{ github.sha }}" \
            --region asia-south1 --project "${{ vars.GCP_PROJECT_ID }}" --quiet
