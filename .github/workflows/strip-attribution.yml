name: strip-attribution

# Removes tool-generated attribution footers from issue, PR and comment
# bodies. Edits made with GITHUB_TOKEN do not re-trigger workflows.

on:
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: strip-attribution-${{ github.event.issue.number || github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      # Base-branch checkout only (pull_request_target never runs PR code).
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - run: node --test .github/scripts/strip_attribution.test.js
      - uses: actions/github-script@v7
        with:
          script: |
            const { clean } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/strip_attribution.js`);
            const { owner, repo } = context.repo;
            async function fixIssue(number, body) {
              const b = clean(body);
              if (b !== null) {
                await github.rest.issues.update({ owner, repo, issue_number: number, body: b });
                core.info(`cleaned #${number}`);
              }
            }
            async function fixComment(id, body) {
              const b = clean(body);
              if (b !== null) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: id, body: b });
                core.info(`cleaned comment ${id}`);
              }
            }
            const e = context.payload;
            if (context.eventName === 'workflow_dispatch') {
              const items = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', per_page: 100 });
              for (const it of items) await fixIssue(it.number, it.body);
              const comments = await github.paginate(github.rest.issues.listCommentsForRepo, { owner, repo, per_page: 100 });
              for (const c of comments) await fixComment(c.id, c.body);
            } else if (context.eventName === 'issue_comment') {
              await fixComment(e.comment.id, e.comment.body);
            } else if (e.pull_request) {
              await fixIssue(e.pull_request.number, e.pull_request.body);
            } else if (e.issue) {
              await fixIssue(e.issue.number, e.issue.body);
            }
