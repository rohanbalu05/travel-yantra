name: ci

# Lanes push straight to main; CI is informational there (no PRs).
on:
  push:
    branches: [main]

permissions:
  contents: read

# Main takes about a push a minute: let each run finish. GitHub keeps only the
# newest waiting run, and that run diffs from the last green one (see changes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      py: ${{ steps.scope.outputs.py }}
      api: ${{ steps.scope.outputs.api }}
      web: ${{ steps.scope.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Diff against the last green ci run on main, not just this push's
          # parent, so commits whose run was cancelled by a newer push still
          # get their jobs.
          BASE=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci --branch main --status success \
            --limit 1 --json headSha --jq '.[0].headSha // empty' 2>/dev/null || true)
          git cat-file -e "$BASE" 2>/dev/null || BASE=$BEFORE
          echo "diff base: ${BASE:-none}"
          # Which folders changed, and do they have a project file yet?
          if [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null; then
            changed=$(git diff --name-only "$BASE" HEAD)
          else
            changed=$(git ls-files)
          fi
          echo "$changed" | grep -q '^.github/workflows/ci.yml$' && changed=$(git ls-files)
          hit() { echo "$changed" | grep -q "^$1/" && [ -f "$1/$2" ]; }
          out=()
          for pair in contracts:packages/contracts translate:services/translate whatsapp:apps/bots/whatsapp chat:apps/bots/chat mcp:apps/mcp; do
            name=${pair%%:*}; dir=${pair#*:}
            hit "$dir" pyproject.toml && out+=("{\"name\":\"$name\",\"dir\":\"$dir\"}")
          done
          echo "py=[$(IFS=,; echo "${out[*]}")]" >> "$GITHUB_OUTPUT"
          # ty-api mounts TY5's chat engine (apps/bots/chat) as a path dependency.
          if (hit apps/api pyproject.toml || hit packages/contracts pyproject.toml || hit apps/bots/chat pyproject.toml) \
             && [ -f apps/api/pyproject.toml ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"; else echo "api=false" >> "$GITHUB_OUTPUT"; fi
          hit apps/web package.json && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test .github/scripts/strip_attribution.test.js
      - run: python3 -m unittest discover -s .github/scripts -p '*_test.py'
      - run: python3 -m unittest discover -s infra/fixtures -p '*_test.py'
      - name: actionlint
        run: |
          bash <(curl -sSfL --max-time 60 https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  python:
    needs: changes
    if: needs.changes.outputs.py != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.py) }}
    defaults:
      run:
        working-directory: ${{ matrix.project.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run pytest -m "not slow"

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ty
          POSTGRES_PASSWORD: ty_ci_only
          POSTGRES_DB: ty_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ty" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ty:ty_ci_only@localhost:5432/ty_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run pytest -m "not slow"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build every service image from the repo root
        run: |
          for d in apps/api apps/mcp apps/bots/whatsapp services/translate; do
            [ -f "$d/Dockerfile" ] || { echo "skip $d: no Dockerfile"; continue; }
            docker build -f "$d/Dockerfile" -t "ci-$(basename "$d")" .
          done
          # The web image's Dockerfile lives in infra/ (TY6); its source is apps/web.
          if [ -f apps/web/package.json ]; then
            docker build -f infra/web/Dockerfile -t ci-web .
          fi

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # No NEXT_PUBLIC_API_BASE_URL here, so the build (and the e2e run) use the mock API.
      - run: pnpm build
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium --only-shell
      # Card #44: starts the standalone server on 127.0.0.1:3100 itself (e2e/serve.mjs).
      - run: pnpm e2e
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  ci:
    name: ci
    needs: [changes, scripts, python, api, docker, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1;; esac
