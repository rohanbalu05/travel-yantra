name: record-fixtures

# Runs infra/fixtures/record.py with API secrets in env (live calls happen
# only here), checks the output with sanitise.py and uploads it as an
# artifact. TY6 downloads it, reviews it and commits fixtures/recorded/ (no PRs
# in v3, and Rohan stays the author). Budget: 8 SerpApi searches per run.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Providers to record (space-separated: places routes wikimedia serpapi; empty = all)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: record-fixtures
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          ONLY: ${{ inputs.only }}
        run: |
          args=()
          for p in $ONLY; do args+=(--only "$p"); done
          python3 infra/fixtures/record.py --out fixtures/recorded "${args[@]}"
      - name: Sanitise
        run: python3 infra/fixtures/sanitise.py fixtures/recorded
      - uses: actions/upload-artifact@v4
        with:
          name: recorded-fixtures
          path: fixtures/recorded/
          if-no-files-found: error
          retention-days: 7
