name: codex-round2

# After a lane pushes fixes it adds `fixes-pushed`. The first time, ask Codex
# for round 2 from Rohan's account. After that, Codex is never asked again
# (two rounds at most): the backup reviewer takes over.
# pull_request_target: runs from main and checks out no PR code.

on:
  pull_request_target:
    types: [labeled]

permissions:
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: codex-round2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  round2:
    if: github.event.label.name == 'fixes-pushed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        env:
          REVIEW_PAT: ${{ secrets.REVIEW_PAT }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const labels = (await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number: number })).data.map((l) => l.name);
            if (labels.includes('codex-round2-sent')) {
              core.info('round 2 already sent; using the backup reviewer');
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'backup-review.yml', ref: context.payload.repository.default_branch,
                inputs: { pr: String(number) },
              });
            } else {
              if (!process.env.REVIEW_PAT) core.setFailed('REVIEW_PAT is not set');
              const asRohan = github.getOctokit(process.env.REVIEW_PAT);
              await asRohan.rest.issues.createComment({ owner, repo, issue_number: number, body: '@codex review' });
              await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: ['codex-round2-sent'] });
            }
            await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: 'fixes-pushed' });
