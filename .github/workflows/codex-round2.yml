name: codex-round2

# After a lane pushes fixes it adds `fixes-pushed`. The first time, ask Codex
# for round 2 from Rohan's account. After that, Codex is never asked again
# (two rounds at most): the backup reviewer takes over.
# pull_request_target: runs from main and checks out no PR code.

on:
  pull_request_target:
    types: [labeled]

permissions:
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: codex-round2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  round2:
    if: github.event.label.name == 'fixes-pushed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const labels = (await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number })).data.map((l) => l.name);
            const sent = labels.includes('codex-round2-sent');
            core.setOutput('sent', String(sent));
            if (sent) {
              core.info('round 2 already sent; using the backup reviewer');
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'backup-review.yml', ref: context.payload.repository.default_branch,
                inputs: { pr: String(issue_number) },
              });
            }
      # The comment must come from Rohan's account, so it uses REVIEW_PAT.
      - if: steps.check.outputs.sent != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REVIEW_PAT }}
          script: |
            const { owner, repo } = context.repo;
            await github.rest.issues.createComment({
              owner, repo, issue_number: context.payload.pull_request.number, body: '@codex review',
            });
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            if ('${{ steps.check.outputs.sent }}' !== 'true') {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['codex-round2-sent'] });
            }
            await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'fixes-pushed' });
